name: Deploy Showcase to GitHub Pages & Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Split upload (`build`) and deployment (`deploy`) into two jobs (`needs: build`)
  # to avoid the sub-second Twirp ListArtifacts eventual-consistency race when
  # `deploy-pages@v4` runs immediately after `upload-pages-artifact@v3` in the same job
  # (upstream issue: actions/deploy-pages#451).
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static showcase artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: showcase

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-cloudflare:
    needs: build
    if: ${{ github.repository == 'abca12a/gate-first' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages (gate-first.dimilinks.com)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy showcase --project-name=gate-first --branch=main
